<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual capture frame</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    iframe{display:block;width:100vw;height:100vh;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe id="screen" title="매뉴얼 캡처 대상 화면"></iframe>
  <script>
    const params = new URLSearchParams(location.search)
    const route = params.get("route") || "#/"
    const callouts = JSON.parse(params.get("callouts") || "[]")
    const frame = document.getElementById("screen")

    const visible = (element, view) => {
      const rect = element.getBoundingClientRect()
      const style = view.getComputedStyle(element)
      return rect.width > 5 && rect.height > 5 && style.display !== "none" && style.visibility !== "hidden"
    }

    function findText(doc, view, overlay, text) {
      if (!text) return null
      const matches = [...doc.body.querySelectorAll("h1,h2,h3,h4,button,[role=button],[role=tab],[aria-label],section,article,div")]
        .filter((element) => element.id !== overlay.id && visible(element, view) && ((element.getAttribute("aria-label") || "").includes(text) || (element.textContent || "").trim().includes(text)))
        .sort((a, b) => {
          const ar = a.getBoundingClientRect()
          const br = b.getBoundingClientRect()
          return (ar.width * ar.height) - (br.width * br.height)
        })
      const match = matches[0]
      if (!match) return null
      const card = match.closest("article,section,[class*='card'],[class*='Card'],header")
      if (!card || card === doc.body) return match
      const mr = match.getBoundingClientRect()
      const cr = card.getBoundingClientRect()
      return cr.width * cr.height <= mr.width * mr.height * 18 && cr.height <= view.innerHeight * 0.78 ? card : match
    }

    async function anonymize(doc) {
      const sourceUrl = new URL("../src/data/schema.ts", location.href)
      let memberNames = []
      try {
        const source = await fetch(sourceUrl).then((response) => response.text())
        const block = source.match(/export const MEMBERS\s*=\s*\[([\s\S]*?)\]\s*(?:as const)?\s*;?/)?.[1] || ""
        memberNames = [...block.matchAll(/name:\s*"([^"]+)"/g)].map((match) => match[1])
      } catch {}
      const replacements = new Map(memberNames.map((name, index) => [name, "데모 사용자 " + (index + 1)]))
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT)
      let textNode
      let replaced = 0
      while ((textNode = walker.nextNode())) {
        let value = textNode.nodeValue || ""
        for (const [name, alias] of replacements) {
          if (!value.includes(name)) continue
          value = value.split(name).join(alias)
          replaced += 1
        }
        textNode.nodeValue = value
      }
      for (const element of doc.querySelectorAll("[aria-label], [title]")) {
        for (const attribute of ["aria-label", "title"]) {
          let value = element.getAttribute(attribute) || ""
          for (const [name, alias] of replacements) value = value.split(name).join(alias)
          element.setAttribute(attribute, value)
        }
      }
      return { aliases: replacements.size, replaced }
    }

    function draw(doc, view) {
      const overlay = doc.createElement("div")
      overlay.id = "manual-capture-overlay"
      Object.assign(overlay.style, { position:"absolute", inset:"0", width:"100%", height:Math.max(doc.documentElement.scrollHeight, view.innerHeight)+"px", pointerEvents:"none", zIndex:"2147483647" })
      doc.body.appendChild(overlay)
      const drawn = []
      for (const callout of callouts) {
        let target = null
        if (callout.selector) {
          try { target = doc.querySelector(callout.selector) } catch {}
        }
        if (!target || !visible(target, view)) target = findText(doc, view, overlay, callout.findText)
        if (!target || !visible(target, view)) continue
        const rect = target.getBoundingClientRect()
        const clipped = { left:Math.max(6,rect.left), top:Math.max(6,rect.top), right:Math.min(view.innerWidth-6,rect.right), bottom:Math.min(view.innerHeight-6,rect.bottom) }
        if (clipped.right <= clipped.left || clipped.bottom <= clipped.top || clipped.top >= view.innerHeight || clipped.bottom <= 0) continue
        const box = doc.createElement("div")
        Object.assign(box.style, { position:"absolute", left:(view.scrollX+clipped.left-4)+"px", top:(view.scrollY+clipped.top-4)+"px", width:(clipped.right-clipped.left+8)+"px", height:(clipped.bottom-clipped.top+8)+"px", border:"2.5px solid #0D9488", borderRadius:"10px", boxShadow:"0 0 0 4px rgba(13,148,136,.16),0 8px 24px rgba(13,148,136,.25)" })
        const badge = doc.createElement("span")
        badge.textContent = String(callout.n)
        Object.assign(badge.style, { position:"absolute", left:"-15px", top:"-15px", width:"34px", height:"34px", borderRadius:"50%", display:"grid", placeItems:"center", background:"#0D9488", color:"white", border:"2px solid white", font:"700 20px/1 'IBM Plex Mono',ui-monospace,sans-serif", boxShadow:"0 5px 14px rgba(15,23,42,.3)" })
        box.appendChild(badge)
        overlay.appendChild(box)
        drawn.push({ n:callout.n, label:callout.label })
      }
      return drawn
    }

    function publish(result) {
      const meta = document.createElement("meta")
      meta.name = "capture-result"
      meta.content = btoa(unescape(encodeURIComponent(JSON.stringify(result))))
      document.head.appendChild(meta)
    }

    frame.addEventListener("load", () => {
      setTimeout(async () => {
        try {
          const view = frame.contentWindow
          const doc = frame.contentDocument
          doc.documentElement.style.scrollBehavior = "auto"
          view.scrollTo(0, 0)
          doc.getAnimations().forEach((animation) => animation.finish())
          const anonymized = await anonymize(doc)
          const labels = [...doc.querySelectorAll("[aria-label]")].map((element) => element.getAttribute("aria-label") || "")
          const nonZeroKpiLabels = labels.filter((label) => /(?:KPI|누적|현황|도달률|완료율|분포)/i.test(label) && /[1-9][0-9]*(?:[,.][0-9]+)?(?:%|건|개)?/.test(label)).length
          const drawn = draw(doc, view)
          publish({ drawn, nonZeroKpiLabels, ...anonymized })
        } catch {
          publish({ drawn:[], nonZeroKpiLabels:0, aliases:0, replaced:0 })
        }
      }, 5000)
    }, { once:true })
    frame.src = "/-3-/" + route
  </script>
</body>
</html>
