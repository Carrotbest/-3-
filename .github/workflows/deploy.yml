name: Deploy to GitHub Pages

on:
  push:
    branches: [main, redesign/v2]
  workflow_dispatch:
  # 트렌드 수집 워크플로가 데이터를 커밋한 뒤 직접 호출한다.
  # GITHUB_TOKEN이 만든 push는 다른 워크플로를 깨우지 않으므로 push 트리거로는 배포가 안 된다.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
