name: Trend collect
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Trend manual · {0}', inputs.mode) || 'Trend automatic' }}

# TREND REPORT 자동 수집. 사내 PC나 작업 스케줄러가 필요 없다.
# 수집 결과를 저장소에 커밋한 뒤 Pages 배포를 직접 호출한다.
on:
  schedule:
    # 매일 21:00 UTC = 06:00 KST. 기사 수집.
    - cron: "0 21 * * *"
    # 매주 월요일 21:30 UTC = 화요일 06:30 KST. 바이어·정부 지표.
    - cron: "30 21 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "수동 수집 범위"
        type: choice
        options:
          - articles
          - kpi
          - all
        default: all

permissions:
  contents: write

concurrency:
  group: trend-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/trend/requirements.txt

      - run: pip install -r tools/trend/requirements.txt

      - name: 기사 수집
        if: github.event.schedule == '0 21 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'articles' || inputs.mode == 'all'))
        working-directory: tools/trend
        env:
          # 제목 한국어 변환의 예비 엔드포인트 무료 한도를 올린다. 없어도 동작한다.
          MT_CONTACT: ${{ secrets.MT_CONTACT }}
        run: python run.py collect

      - name: 대표 이미지 보강
        if: github.event.schedule == '0 21 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'articles' || inputs.mode == 'all'))
        continue-on-error: true
        working-directory: tools/trend
        run: python run.py images

      - name: KPI 수집
        # 주간 cron 또는 웹에서 KPI/전체를 요청했을 때만 돈다. 월간 지표를 매일 긁지 않는다.
        if: github.event.schedule == '30 21 * * 1' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'kpi' || inputs.mode == 'all'))
        working-directory: tools/trend
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run.py kpi

      - name: 결과 커밋
        id: commit
        run: |
          git config user.name "trend-bot"
          git config user.email "actions@github.com"
          git add tools/trend/data public/data/trend
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
          else
            git commit -m "chore(trend): 수집 결과 갱신 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
